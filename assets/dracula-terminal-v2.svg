<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1F29"/>
      <stop offset="1" stop-color="#282A36"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="1164" height="324" rx="14" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="18" y="18" width="1164" height="34" rx="14" fill="#21222C"/>
  <rect x="18" y="40" width="1164" height="302" fill="#282A36"/>

  <circle cx="42" cy="35" r="6" fill="#FF5555"/>
  <circle cx="62" cy="35" r="6" fill="#F1FA8C"/>
  <circle cx="82" cy="35" r="6" fill="#50FA7B"/>

  <text x="106" y="39" fill="#6272A4" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13">dracula • zsh • profile</text>

  <text x="38" y="90" fill="#50FA7B" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">➜</text>
  <text x="70" y="90" fill="#8BE9FD" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">whoami</text>
  <text x="38" y="130" fill="#F8F8F2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">Isaac Zhu</text>

  <text x="38" y="176" fill="#50FA7B" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">➜</text>
  <text x="70" y="176" fill="#8BE9FD" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">mode</text>
  <text x="136" y="176" fill="#FF79C6" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">=</text>
  <text x="162" y="176" fill="#F1FA8C" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">"terminal-first"</text>

  <text x="38" y="222" fill="#50FA7B" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">➜</text>
  <text x="70" y="222" fill="#8BE9FD" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">motto</text>
  <text x="138" y="222" fill="#FF79C6" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">:</text>
  <text x="158" y="222" fill="#F1FA8C" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">ship small, ship useful</text>

  <text x="38" y="268" fill="#BD93F9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">$ make ship ENV=prod</text>
  <text x="38" y="304" fill="#6272A4" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">$ ./ship --small --fast --reliable</text>
  <text x="38" y="336" fill="#50FA7B" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">✔ deployed</text>
</svg>
